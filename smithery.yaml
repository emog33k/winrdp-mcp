# Smithery deployment manifest — https://smithery.ai/docs
# winrdp-mcp runs locally as a stdio server (it needs network reach to your boxes and a
# local encrypted vault), so we expose it as a stdio command with a small config schema.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      vaultKey:
        type: string
        title: Vault key
        description: >-
          Fernet key used to encrypt the host inventory at rest (WINRDP_VAULT_KEY).
          Leave blank to use a machine-local key file. Provide one to share an
          inventory across machines.
      profile:
        type: string
        title: Tool profile
        enum: [full, dynamic, admin, rdp, core]
        default: full
        description: >-
          Which tool set to expose. 'full' = every tool (147); 'dynamic' = lean core
          with load-on-demand groups (enable_toolset); 'admin' = systems administration;
          'rdp' = RDP + desktop/GUI; 'core' = the essential subset.
      confirmDestructive:
        type: boolean
        title: Confirm destructive actions
        default: false
        description: >-
          Require operator confirmation (via MCP elicitation) before any destructive tool
          runs. Clients without elicitation fall back to their own destructiveHint gating.
      debug:
        type: boolean
        title: Debug logging
        default: false
        description: Verbose logging to stderr.
    required: []
  commandFunction: |-
    (config) => ({
      command: 'winrdp-mcp',
      args: ['serve'].concat(config.debug ? ['--debug'] : []),
      env: Object.assign(
        {},
        config.vaultKey ? { WINRDP_VAULT_KEY: config.vaultKey } : {},
        config.profile ? { WINRDP_PROFILE: config.profile } : {},
        config.confirmDestructive ? { WINRDP_CONFIRM_DESTRUCTIVE: '1' } : {}
      )
    })
  exampleConfig:
    profile: full
    debug: false
